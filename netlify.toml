[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"
  SECRETS_SCAN_OMIT_KEYS = "AI_PROVIDER,AI_MODEL,AI_REASONING_EFFORT,AI_DAILY_NEURON_BUDGET"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Prisma migrations are an explicit release step. They must not run in deploy
# previews or as part of the Netlify build.
