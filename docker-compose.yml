services:
  postgres:
    image: postgres:16-alpine
    container_name: applyflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: applyflow
      POSTGRES_USER: applyflow
      POSTGRES_PASSWORD: applyflow
    ports:
      - "5432:5432"
    volumes:
      - applyflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U applyflow -d applyflow"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  applyflow-postgres-data:
